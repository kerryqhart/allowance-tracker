[package]
name = "allowance-tracker-egui"
version = "0.1.0"
edition = "2021"
description = "A fun and engaging allowance tracker for kids - egui frontend"



[dependencies]
# egui framework and platform integration
eframe = { version = "0.31.1", features = ["wgpu", "persistence"] }
egui = "0.31.1"
egui_extras = { version = "0.31.1", features = ["image", "file"] }
egui_plot = "0.32"

# Image format support (PNG for app icon, JPEG for backgrounds)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Local dependencies
shared = { path = "../shared" }

# Date and time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling and utilities
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"

# Serialization for persistence
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# CSV file handling
csv = "1.3"

# Platform-specific file operations
dirs = "6.0.0"

# Native file dialogs for cross-platform file browsing
rfd = "0.15"

# Git integration for local repository operations (no network features = no OpenSSL needed)
git2 = { version = "0.19", default-features = false }

# Email functionality
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder"] }
toml = "0.8"

# HTTP client for sync service
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.0"

[package.metadata.bundle]
name = "Allowance Tracker"
identifier = "com.hart.allowance-tracker"
icon = ["../icon.png"]
resources = ["assets/background.jpg"]
category = "Finance"

 
