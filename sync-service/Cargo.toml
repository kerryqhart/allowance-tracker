[package]
name = "sync-service"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
aws-config = "1"
aws-sdk-dynamodb = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1.0", features = ["v4"] }
lambda_http = "0.13"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "blocking"] }
tempfile = "3.0"
